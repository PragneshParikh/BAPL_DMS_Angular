<!-- Page Title -->
<div class="page-title-box d-sm-flex align-items-center justify-content-between mb-3">
    <h4 class="mb-0 text-primary">Vehicle Sale</h4>
</div>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0 text-primary">
            <i class="ri-car-line me-1"></i> Add Vehicle Sale
        </h5>

       <div class="d-flex gap-2 me-3">
                            <button class="btn btn-success btn-sm" >
                                <i class="ri-add-line"></i>
                            </button>

                            <button class="btn btn-success btn-sm" >
                                <i class="ri-file-excel-2-line"></i>
                            </button>
                        </div>
    </div>

    <div class="card-body">

        <form #vehicleSaleForm="ngForm">

            <!-- ================= SALE INFO ================= -->
            <div class="d-flex justify-content-between align-items-center mb-1">
                <h5 class="fs-14 text-primary mb-0">
                    <i class="ri-information-line me-1"></i>Sale Info
                </h5>

                <button class="btn btn-sm btn-primary d-flex align-items-center justify-content-center"
                    type="button" data-bs-toggle="collapse"
                    data-bs-target="#saleInfo">
                    <i class="ri-arrow-down-s-line"></i>
                </button>
            </div>

            <div id="saleInfo" class="collapse show">
                <div class="row">
                    <div class="col-md-3">
                        <label class="form-label">Sale Date</label>
                        <input type="date" class="form-control form-control-sm"
                            [(ngModel)]="model.saleDate" name="saleDate">
                    </div>

                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input"
                                type="checkbox"
                                [(ngModel)]="model.d2d"
                                name="d2d">
                            <label class="form-check-label ms-1">D2D</label>
                        </div>
                    </div>

                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input"
                                type="checkbox"
                                [(ngModel)]="model.saleTypeSwitch"
                                name="saleTypeSwitch">
                            <label class="form-check-label ms-1">
                                {{ model.saleTypeSwitch ? 'B2C' : 'B2B' }}
                            </label>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Location</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.location" name="location">
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-3">
                        <label class="form-label">Sale Type</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.saleType" name="saleType">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Cash A/c</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.cashAccount" name="cashAccount">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Customer Name</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.customerName" name="customerName">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Billing Name</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.billingName" name="billingName">
                    </div>
                </div>
            </div>

            <!-- ================= VEHICLE DETAILS ================= -->
            <div class="d-flex justify-content-between align-items-center mt-3 mb-1">
                <h5 class="fs-14 text-primary mb-0">
                    <i class="ri-car-line me-1"></i>Vehicle Details
                </h5>

                <button class="btn btn-sm btn-primary"
                    type="button" data-bs-toggle="collapse"
                    data-bs-target="#vehicleDetails">
                    <i class="ri-arrow-down-s-line"></i>
                </button>
            </div>

            <div id="vehicleDetails" class="collapse">
                <div class="row">
                    <div class="col-md-3">
                        <label class="form-label">Chassis No</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.chassisNo" name="chassisNo">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Item Rate</label>
                        <input type="number" class="form-control form-control-sm"
                            [(ngModel)]="model.itemRate" name="itemRate">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Battery</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.battery" name="battery">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Delivered</label>
                        <select class="form-select form-select-sm"
                            [(ngModel)]="model.delivered" name="delivered">
                            <option value="">Select</option>
                            <option value="Y">Yes</option>
                            <option value="N">No</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- ================= EXTRA CHARGES ================= -->
            <div class="d-flex justify-content-between align-items-center mt-3 mb-1">
                <h5 class="fs-14 text-primary mb-0">
                    <i class="ri-money-rupee-circle-line me-1"></i>Extra Charges
                </h5>

                <button class="btn btn-sm btn-primary"
                    type="button" data-bs-toggle="collapse"
                    data-bs-target="#extraCharges">
                    <i class="ri-arrow-down-s-line"></i>
                </button>
            </div>

            <div id="extraCharges" class="collapse">
                <div class="row">
                    <div class="col-md-3">
                        <label class="form-label">Accessory Amount</label>
                        <input type="number" class="form-control form-control-sm"
                            [(ngModel)]="model.accessoryAmount" name="accessoryAmount">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Discount</label>
                        <input type="number" class="form-control form-control-sm"
                            [(ngModel)]="model.discount" name="discount">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Handling Charges</label>
                        <input type="number" class="form-control form-control-sm"
                            [(ngModel)]="model.handlingCharges" name="handlingCharges">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">HP Amount</label>
                        <input type="number" class="form-control form-control-sm"
                            [(ngModel)]="model.hpAmount" name="hpAmount">
                    </div>
                </div>
            </div>

            <!-- ================= ACCESSORIES ================= -->
            <div class="d-flex justify-content-between align-items-center mt-3 mb-1">
                <h5 class="fs-14 text-primary mb-0">
                    <i class="ri-tools-line me-1"></i>Accessories Billing
                </h5>

                <button class="btn btn-sm btn-primary"
                    type="button" data-bs-toggle="collapse"
                    data-bs-target="#accessories">
                    <i class="ri-arrow-down-s-line"></i>
                </button>
            </div>

            <div id="accessories" class="collapse">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Item Name</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.itemName" name="itemName">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Qty</label>
                        <input type="number" class="form-control form-control-sm"
                            [(ngModel)]="model.qty" name="qty">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Rate</label>
                        <input type="number" class="form-control form-control-sm"
                            [(ngModel)]="model.rate" name="rate">
                    </div>
                </div>
            </div>

            <!-- ================= REFERRAL ================= -->
            <div class="d-flex justify-content-between align-items-center mt-3 mb-1">
                <h5 class="fs-14 text-primary mb-0">
                    <i class="ri-user-star-line me-1"></i>Referral Details
                </h5>

                <button class="btn btn-sm btn-primary"
                    type="button" data-bs-toggle="collapse"
                    data-bs-target="#referral">
                    <i class="ri-arrow-down-s-line"></i>
                </button>
            </div>

            <div id="referral" class="collapse">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Referral Name</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.referralName" name="referralName">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Mobile</label>
                        <input class="form-control form-control-sm"
                            [(ngModel)]="model.referralMobile" name="referralMobile">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control form-control-sm"
                            [(ngModel)]="model.referralEmail" name="referralEmail">
                    </div>
                </div>
            </div>

        </form>

    </div>
</div>
