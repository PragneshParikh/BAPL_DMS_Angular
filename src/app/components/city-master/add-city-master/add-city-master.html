<!-- src\app\components\city-master\add-city-master\add-city-master.html -->
<!-- Title -->
<div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
  <h4 class="mb-sm-0">
    {{ isEditMode ? 'Edit City' : 'Add City' }}
  </h4>
</div>

<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">

        <form #cityForm="ngForm" (ngSubmit)="onSubmit(cityForm)">

          <!-- Row 1 -->
          <div class="row mb-3">

            <!-- Country -->
            <div class="col-md-3">
              <label>Country Name</label>
              <input type="text" class="form-control form-control-sm" value="India" readonly>
            </div>

            <!-- State -->
            <div class="col-md-3">
              <label>State Name <span class="text-danger">*</span></label>

              <select class="form-select form-select-sm" [(ngModel)]="formData.stateId" name="stateId"
                (change)="checkDuplicateCity()" required>

                <option value="">--Select State--</option>

                <option *ngFor="let state of stateList" [value]="state.stateId">
                  {{ state.stateName }}
                </option>

              </select>
            </div>

            <!-- City -->
            <div class="col-md-3">
              <label>City Name <span class="text-danger">*</span></label>

              <input type="text" class="form-control form-control-sm" [(ngModel)]="formData.cityName" name="cityName"
                (input)="checkDuplicateCity()" required>
                <div *ngIf="cityExists" class="text-danger mt-1">
                  City already exists for selected state
                </div>
            </div>

            <!-- Abbreviation -->
            <div class="col-md-3">
              <label>Abbreviation</label>

              <input type="text" class="form-control form-control-sm" [(ngModel)]="formData.abbreviation"
                name="abbreviation">
            </div>

          </div>

          <!-- Row 2 -->
          <div class="row mb-3">

            <!-- Tier -->
            <div class="col-md-3">
              <label>Tier</label>

              <select class="form-select form-select-sm" [(ngModel)]="formData.tierLevel" name="tierLevel" required>

                <option [value]="1">Tier 1</option>
                <option [value]="2">Tier 2</option>

              </select>
            </div>

            <!-- City Type -->
            <div class="col-md-3">
              <label>City Type</label>

              <select class="form-select form-select-sm" [(ngModel)]="formData.isMetro" name="isMetro">

                <option [ngValue]="true">Metro</option>
                <option [ngValue]="false">Non-Metro</option>

              </select>
            </div>

            <!-- Active -->
            <div class="col-md-3">
              <label>Active</label><br>

              <div class="form-check form-switch mt-1">
                <input class="form-check-input" type="checkbox" [(ngModel)]="formData.isActive" name="isActive">

                <label class="form-check-label">
                  {{ formData.isActive ? 'Active' : 'Inactive' }}
                </label>
              </div>
            </div>

          </div>

          <!-- Buttons -->
          <div class="row mt-4">
            <div class="col-md-12 d-flex justify-content-end gap-2">

              <button type="submit" class="btn btn-primary btn-sm"
                *ngIf="(!isEditMode && canCreate) || (isEditMode && canEdit)"
                [disabled]="cityForm.invalid || cityExists">
                Save
            </button>

              <button type="button" class="btn btn-light btn-sm" (click)="onCancel()">
                Close
              </button>

            </div>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
