<div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
    <h4 class="mb-sm-0">Who Am I</h4>
</div>

<div class="modal-body">
    <div class="row">
        <div class="col-md-6">
            <label class="form-label">Dealer Email<span class="text-danger">*</span></label>
            <input class="form-control form-control-sm" name="email" required
                [(ngModel)]="model.email" placeholder="dealer@example.com" />
        </div>
    </div>

    <div *ngIf="result" class="mt-3">
        <div class="alert" [ngClass]="result.isDefaultPassword ? 'alert-info' : 'alert-warning'">
            {{ result.message }}
        </div>

        <button *ngIf="!result.isDefaultPassword" type="button" class="btn btn-warning btn-sm me-2"
            (click)="forceReset()" [disabled]="loading">
            Force Reset to Default Password
        </button>
    </div>
</div>

<div class="d-flex justify-content mt-4 gap-2">
    <div>
        <button type="submit" class="btn btn-primary btn-sm me-2" (click)="fetch()" [disabled]="loading">
            {{ loading ? 'Checking...' : 'Check Password Status' }}
        </button>
    </div>

    <div>
        <!-- ADDED — one-click login-as-dealer, fully audited server-side -->
        <button type="button" class="btn btn-outline-primary btn-sm" (click)="impersonate()" [disabled]="loading">
            {{ loading ? 'Please wait...' : 'Login as this Dealer' }}
        </button>
    </div>
</div>
