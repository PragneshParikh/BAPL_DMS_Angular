<!-- ===================================================== -->
<!-- PAGE HEADER                                           -->
<!-- ===================================================== -->
<div class="d-flex justify-content-between align-items-center mb-2" *ngIf="!isPopupMode">
  <h4 class="fw-bold mb-0 text-uppercase">
    {{ isEditMode ? 'Edit BG Employee' : 'Add BG Employee' }}
  </h4>
  <button type="button" class="btn btn-secondary btn-sm" (click)="backToList()">
    <i class="ri-arrow-left-line"></i> Back
  </button>
</div>

<!-- ===================================================== -->
<!-- FORM                                                  -->
<!-- ===================================================== -->
<div class="card shadow-sm mx-2">
  <div class="card-body p-3">
    <form #bgEmployeeForm="ngForm" (ngSubmit)="onSubmit(bgEmployeeForm)" autocomplete="off">
      <div class="row">

        <!-- PROFILE IMAGE -------------------------------- -->
        <div class="col-md-2 text-center">

          <div class="border rounded overflow-hidden bg-white d-flex align-items-center justify-content-center"
            style="width:100px; height:120px; margin:auto;">
            <img *ngIf="imagePreview" [src]="imagePreview" class="w-100 h-100" style="object-fit:cover;" />
            <i *ngIf="!imagePreview" class="ri-image-line text-muted" style="font-size:40px;"></i>
          </div>

          <div class="border border-top-0 p-1 fw-semibold" style="width:100px; margin:auto; font-size:12px;">
            Upload Profile Image
          </div>

          <input #fileInput type="file" hidden accept="image/*" (change)="onFileSelect($event)" />

          <button type="button" class="btn btn-primary btn-sm mt-2 px-2 py-1" style="width:100px;"
            (click)="fileInput.click()">
            Upload
          </button>

          <div class="mt-2 text-muted" style="font-size:11px; line-height:18px;">
            <b>Note</b><br>
            3.5cm × 4.5cm, 100 dpi.<br>
            Max size: 50kb.
          </div>

        </div>

        <!-- FORM FIELDS ---------------------------------- -->
        <div class="col-md-10 ps-2">

          <!-- ROW 1 : Code | First Name | Last Name | Gender -->
          <div class="row mb-2">

            <div class="col-md-3">
              <label class="form-label mb-1">Employee Code</label>
              <input type="text" class="form-control form-control-sm py-1 fw-semibold text-primary"
                [(ngModel)]="employeeData.employeeCode" name="employeeCode" readonly
                style="background:#f0f7ff; letter-spacing:0.5px;">
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">First Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-sm py-1"
                [(ngModel)]="employeeData.firstName" name="firstName" required>
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">Last Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-sm py-1"
                [(ngModel)]="employeeData.lastName" name="lastName" required>
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">Gender <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm py-1"
                [ngModel]="employeeData.gender ?? ''"
                (ngModelChange)="employeeData.gender = $event" name="gender" required>
                <option value="">Select Gender</option>
                <option *ngFor="let g of genders" [value]="g.value">{{ g.title }}</option>
              </select>
            </div>

          </div>

          <!-- ROW 2 : Mobile | State | City | Pincode -->
          <div class="row mb-2">

            <div class="col-md-3">
              <label class="form-label mb-1">Mobile No. <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-sm py-1"
                inputmode="numeric" maxlength="10"
                [(ngModel)]="employeeData.mobile" name="mobile"
                (input)="onlyDigits($event, 'mobile', 10)" required>
              <small *ngIf="errors.mobile" class="text-danger">{{ errors.mobile }}</small>
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">State <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm py-1"
                [ngModel]="employeeData.state ?? ''"
                (ngModelChange)="employeeData.state = $event; onStateChange()" name="state" required>
                <option value="">Select State</option>
                <option *ngFor="let s of states" [value]="s.stateId">{{ s.stateName }}</option>
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">City <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm py-1"
                [ngModel]="employeeData.city ?? ''"
                (ngModelChange)="employeeData.city = $event" name="city" required>
                <option value="">Select City</option>
                <option *ngFor="let c of filteredCities" [value]="c.cityId">{{ c.cityName }}</option>
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">Pincode <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-sm py-1"
                inputmode="numeric" maxlength="6"
                [(ngModel)]="employeeData.pincode" name="pincode"
                (input)="onlyDigits($event, 'pincode', 6)" required>
              <small *ngIf="errors.pincode" class="text-danger">{{ errors.pincode }}</small>
            </div>

          </div>

          <!-- ROW 3 : DOJ | DOB | Effective Date | Reporting To -->
          <div class="row mb-2">

            <div class="col-md-3">
              <label class="form-label mb-1">Date of Joining <span class="text-danger">*</span></label>
              <input type="date" class="form-control form-control-sm py-1"
                [(ngModel)]="employeeData.dateOfJoin" name="dateOfJoin" required>
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">Date of Birth <span class="text-danger">*</span></label>
              <input type="date" class="form-control form-control-sm py-1"
                [(ngModel)]="employeeData.dateOfBirth" name="dateOfBirth" required>
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">Effective Date <span class="text-danger">*</span></label>
              <input type="date" class="form-control form-control-sm py-1"
                [(ngModel)]="employeeData.effectiveDate" name="effectiveDate" required>
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">Reporting To</label>
              <input type="text" class="form-control form-control-sm py-1"
                [(ngModel)]="employeeData.reportingTo" name="reportingTo"
                placeholder="Supervisor name / code">
            </div>

          </div>

          <!-- ROW 4 : Status | Department -->
          <div class="row mb-2">

            <div class="col-md-3">
              <label class="form-label mb-1">Status</label>
              <select class="form-select form-select-sm py-1"
                [ngModel]="employeeData.isActive ?? true"
                (ngModelChange)="employeeData.isActive = $event" name="isActive">
                <option [ngValue]="true">Active</option>
                <option [ngValue]="false">Inactive</option>
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label mb-1">Department <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm py-1"
                [ngModel]="employeeData.department ?? ''"
                (ngModelChange)="employeeData.department = $event" name="department" required>
                <option value="">Select Department</option>
                <option *ngFor="let d of departments" [value]="d.departmentId">
                  {{ d.departmentName }}
                </option>
              </select>
            </div>

          </div>

          <!-- ============================================ -->
          <!-- EMPLOYEE PROFILE MASTER MAPPING              -->
          <!-- ============================================ -->
          <div class="section-card mb-3">
            <div class="section-header">
              <i class="ri-group-line"></i> Employee Profile Master Mapping
            </div>

            <div class="section-body">
              <div class="col-md-4 px-0">
                  <label class="form-label mb-1" style="font-size:12px;">
                    Profile <span class="text-danger">*</span>
                  </label>
                  <select class="form-select form-select-sm py-1"
                    [(ngModel)]="pendingProfileId"
                    name="pendingProfileId">
                    <!-- [ngValue]="0" keeps type as number — avoids string/number mismatch -->
                    <option [ngValue]="0">— Select Profile —</option>
                    <option *ngFor="let p of allProfiles" [ngValue]="p.id">
                      {{ p.profileName }}
                    </option>
                  </select>
                </div>
            </div>
          </div>

          <!-- ============================================ -->
          <!-- LOGIN CREDENTIALS                            -->
          <!-- ============================================ -->
          <div class="section-card mb-3">

            <div class="section-header">
              <i class="ri-lock-line"></i> Login Credentials
            </div>

            <div class="section-body">
              <div class="row g-2">

                <div class="col-md-4">
                  <label class="form-label mb-1">Email ID <span class="text-danger">*</span></label>
                  <input type="email" class="form-control form-control-sm py-1"
                    [(ngModel)]="employeeData.emailId" name="emailId" required autocomplete="off">
                </div>

                <div class="col-md-4">
                  <label class="form-label mb-1">
                    Password
                    <span class="text-danger" *ngIf="!isEditMode">*</span>
                    <small class="text-muted ms-1" *ngIf="isEditMode">(leave blank to keep current)</small>
                  </label>
                  <div class="input-group input-group-sm">
                    <input [type]="showPassword ? 'text' : 'password'"
                      class="form-control form-control-sm py-1"
                      [(ngModel)]="employeeData.password" name="password"
                      autocomplete="new-password">
                    <button type="button" class="btn btn-outline-secondary py-0 px-2"
                      (click)="showPassword = !showPassword">
                      <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
                    </button>
                  </div>
                  <small *ngIf="errors.password" class="text-danger">{{ errors.password }}</small>
                  <small class="text-muted d-block" style="font-size:10px;">
                    Min 6 chars · uppercase · lowercase · digit · special char
                  </small>
                </div>

              </div>
            </div>
          </div>

          <!-- ACTION BUTTONS ------------------------------ -->
          <div class="text-end mt-2">
            <button type="button" class="btn btn-secondary btn-sm px-3 py-1 me-2"
              (click)="backToList()">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm px-3 py-1"
              [disabled]="!isFormValid">
              {{ isEditMode ? 'Update' : 'Save' }}
            </button>
          </div>

        </div>
        <!-- end col-md-10 -->

      </div>
    </form>
  </div>
</div>
