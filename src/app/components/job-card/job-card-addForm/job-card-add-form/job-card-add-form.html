<div class="card">
  <!-- HEADER -->
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Job Card (Invoice No. 307)</h5>
    <div>
      <button class="btn btn-soft-secondary btn-sm me-2">Service History</button>
      <button class="btn btn-soft-success btn-sm">Job Done</button>
    </div>
  </div>
  <div class="card-body">
    <!-- ================= JOB BASIC ================= -->
    <div class="section-card">
      <div class="section-header" (click)="toggle('job')">
        <h6 class="mb-0">Job Basic Information</h6>
        <i [class]="isOpen.job ? 'ri-arrow-up-s-line' : 'ri-arrow-down-s-line'"></i>
      </div>
      <div class="section-body" *ngIf="isOpen.job">
        <div class="row">
          <!-- ================= LEFT SIDE (JOB DETAILS) ================= -->
          <div class="col-md-6 border-end pe-3">
            <div class="row g-3">
              <div class="col-md-4">
                <label>Job Type</label>
                <select class="form-select form-select-sm text-truncate" (change)="onJobType($event)">
                  <option value="">Select Job Type</option>
                  <option *ngFor="let job of JobType" [value]="job.value">
                    {{ job.name }}
                  </option>
                </select>
              </div>
              <div class="col-md-4">
                <label>Select Chassis</label>
                <input class="form-control form-control-sm" value="P6DEC12DPEC004809">
              </div>
              <div class="col-md-4">
                <label>Vehicle Journey</label>
                <input class="form-control form-control-sm" value="0">
              </div>
              <div class="col-md-4">
                <label>Service Head</label>
                <select class="form-select form-select-sm">
                  <option value="">Select service head</option>
                  <option value="Manoj">Manoj</option>
                  <option value="Suraj">Suraj</option>
                  <option value="Vishal">Vishal</option>
                </select>
              </div>
              <div class="col-md-4">
                <label>Service Type</label>
                <select class="form-select form-select-sm" (change)="onJobType($event)">
                  <option value="">Select service Type</option>
                  <option *ngFor="let job of JobType" [value]="job.value">
                    {{ job.name }}
                  </option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-lael">Service Location</label>
                <select class="form-select form-select-sm text-truncate" (change)="onLocationChange($event)">
                  <option value="">Select Location</option>
                  <option *ngFor="let loc of locations" [value]="loc.locname">
                    {{ loc.locname }}
                  </option>
                </select>
              </div>
              <div class="col-md-4">
                <label>Coupon No</label>
                <input class="form-control form-control-sm" value="0">
              </div>
              <h6>Job Details</h6>
              <hr class="custom-line">
              <div class="col-md-3">
                <label>Job Prefix</label>
                <input class="form-control form-control-sm" value="0">
              </div>
              <div class="col-md-3">
                <label>Job In Date</label>
                <input class="form-control form-control-sm" type="date">
              </div>
              <div class="col-md-3">
                <label>Job No.</label>
                <input class="form-control form-control-sm" value="0">
              </div>
              <div class="col-md-3">
                <label>Manual Job No.</label>
                <input class="form-control form-control-sm" value="0">
              </div>
              <div class="col-md-3">
                <label>Manual Job Time</label>
                <input class="form-control form-control-sm" type="time">
              </div>
              <div class="col-md-3">
                <label>Time In</label>
                <input class="form-control form-control-sm" type="time">
              </div>
              <div class="col-md-3">
                <label>Est.Delivery Date</label>
                <input class="form-control form-control-sm" type="date">
              </div>
              <div class="col-md-3">
                <label>Est.Delivery Time</label>
                <input class="form-control form-control-sm" type="time">
              </div>
              <div class="col-md-3">
                <label class="form-lael">Job Source/Location</label>
                <select class="form-select form-select-sm text-truncate" (change)="onLocationChange($event)">
                  <option value="">Select Location</option>
                  <option *ngFor="let loc of locations" [value]="loc.locname">
                    {{ loc.locname }}
                  </option>
                </select>
              </div>
              <div class="col-md-3">
                <label>Supervisor/Advisor</label>
                <select class="form-select form-select-sm">
                  <option value="">Select Supervisor</option>
                  <option value="Manoj">Manoj</option>
                  <option value="Suraj">Suraj</option>
                  <option value="Vishal">Vishal</option>
                </select>
              </div>
              <div class="col-md-3">
                <label>Technician</label>
                <select class="form-select form-select-sm">
                  <option value="">Select Technician</option>
                  <option value="Manoj">Manoj</option>
                  <option value="Suraj">Suraj</option>
                  <option value="Vishal">Vishal</option>
                </select>
              </div>
              <div class="col-md-3">
                <label>Job Estimate</label>
                <input class="form-control form-control-sm" value="0">
              </div>
              <div class="col-md-3">
                <label>Date Of Failure</label>
                <input class="form-control form-control-sm" type="date">
              </div>
              <div class="col-md-3">
                <label>Air Pressure Rear Tyre</label>
                <input class="form-control form-control-sm" value="0">
              </div>
              <div class="col-md-3">
                <label>Air Pressure Front Tyre</label>
                <input class="form-control form-control-sm" value="0">
              </div>
              <div class="col-md-3">
                <label>Vehicle Category</label>
                <select class="form-select form-select-sm">
                  <option value="">Select Vehicle Category</option>
                  <option value="FG">FG</option>
                  <option value="Scooter">Scooter</option>
                </select>
              </div>
            </div>
          </div>

          <!-- ================= RIGHT SIDE (CUSTOMER DETAILS) ================= -->
          <div class="col-md-6 ps-3">
            <h6 class="mb-3">Customer Details</h6>

            <div class="row g-3">

              <div class="col-md-6">
                <label>Customer Name</label>
                <input class="form-control form-control-sm" placeholder="Enter name">
              </div>

              <div class="col-md-6">
                <label>Mobile No</label>
                <input class="form-control form-control-sm" placeholder="Enter mobile">
              </div>

              <div class="col-md-6">
                <label>Email</label>
                <input class="form-control form-control-sm" placeholder="Enter email">
              </div>

              <div class="col-md-6">
                <label>City</label>
                <input class="form-control form-control-sm" placeholder="Enter city">
              </div>

              <div class="col-md-12">
                <label>Address</label>
                <textarea class="form-control form-control-sm" rows="2"></textarea>
              </div>

              <div class="col-md-6">
                <label>Vehicle Number</label>
                <input class="form-control form-control-sm">
              </div>

              <div class="col-md-6">
                <label>Model</label>
                <input class="form-control form-control-sm">
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
    <!-- ================= BATTERY ================= -->
    <div class="section-card">
      <div class="section-header" (click)="toggle('battery')">
        <h6 class="mb-0">Battery Details</h6>
        <i [class]="isOpen.battery ? 'ri-arrow-up-s-line' : 'ri-arrow-down-s-line'"></i>
      </div>
      <div class="section-body" *ngIf="isOpen.battery">
        <div class="row g-3">
          <div class="col-md-6">
            <label>Battery Make</label>
            <input class="form-control form-control-sm" value="Trontek Electronics ltd">
          </div>
          <div class="col-md-6">
            <label>Battery Serial No</label>
            <input class="form-control form-control-sm" value="TK614818CZC027901">
          </div>
          <div class="col-md-6">
            <label>Battery Capacity</label>
            <input class="form-control form-control-sm" value="2.7 kWh">
          </div>
          <div class="col-md-6">
            <label>Battery Chemical</label>
            <input class="form-control form-control-sm" value="LFP">
          </div>
        </div>
      </div>
    </div>
    <!-- ================= CUSTOMER VOICE ================= -->
    <div class="section-card">
      <div class="section-header" (click)="toggle('voice')">
        <h6 class="mb-0">Customer Voice</h6>
        <i [class]="isOpen.voice ? 'ri-arrow-up-s-line' : 'ri-arrow-down-s-line'"></i>
      </div>
      <div class="section-body" *ngIf="isOpen.voice">
        <div class="row g-3">
          <div class="col-md-4">
            <label>Complaint Code</label>
            <input class="form-control form-control-sm">
          </div>
          <div class="col-md-4">
            <label>Description</label>
            <input class="form-control form-control-sm">
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button class="btn btn-primary btn-sm">Add</button>
          </div>
        </div>
        <div class="text-center mt-3 text-muted">
          Record(s) not found.
        </div>
      </div>
    </div>
  </div>
  <!-- FOOTER -->
  <div class="card-footer d-flex justify-content-end gap-2">
    <button class="btn btn-add btn-sm">Save</button>
    <button class="btn btn-light btn-sm">Cancel</button>
  </div>
</div>
