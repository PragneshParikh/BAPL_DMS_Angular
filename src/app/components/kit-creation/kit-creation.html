<!-- Header -->
<div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
    <h4 class="mb-sm-0">KIT Creation</h4>
    <div class="position-relative">
        <input type="text" placeholder="Search..." autocomplete="on" class="form-control" [(ngModel)]="searchTerm">
    </div>
</div>
<!-- KIT Table -->



<div class="table-responsive">
    <table class="table table-gridjs table-striped dealer-table">
        <thead>
            <tr>
                <th class="sort" (click)="onSort('compname')" style="cursor: pointer">Sr. No.</th>
                <th class="sort" (click)="onSort('dealercode')" style="cursor: pointer">Product Name</th>
                <th class="sort" (click)="onSort('city')" style="cursor: pointer">Date Added</th>
                <th class="sort" (click)="onSort('state')" style="cursor: pointer">Status</th>
            </tr>
        </thead>
        <tbody>
            @for (kit of kitData; track $index) {
            <tr style="cursor: pointer">
                <td><ngb-highlight [result]="kit.srno" [term]="searchTerm"></ngb-highlight></td>
                <td><ngb-highlight [result]="kit.productName" [term]="searchTerm"></ngb-highlight></td>
                <td><ngb-highlight [result]="kit.DateAdded" [term]="searchTerm"></ngb-highlight></td>
                <td><ngb-highlight [result]="kit.Status" [term]="searchTerm"></ngb-highlight></td>
            </tr>
            }
        </tbody>
    </table>
</div>


<!-- Pagination -->
<div class="row mt-3">
    <div class="col-sm-12 col-md-20">
        <div class="text-md-right float-md-end gridjs-pagination">
            <ngb-pagination [collectionSize]="kitData.length" [(page)]="page" [pageSize]="pageSize"
                (pageChange)="refreshPage()" [boundaryLinks]="true">
            </ngb-pagination>
        </div>
    </div>
</div>
