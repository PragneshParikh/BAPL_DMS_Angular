<div id="kit-creation-list">
    <!-- Start Breadcrumbs -->
    <app-breadcrumbs title="KIT Creation"></app-breadcrumbs>
    <!-- End Breadcrumbs -->

    <div class="card-body">
        <div class="page-content p-0">
            <div class="container-fluid px-1">

                <!-- Table Card -->
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">

                            <div class="text-muted">
                                Total Record(s): {{ collectionSize }}
                            </div>

                            <div class="d-flex align-items-center gap-2">

                                <button class="btn btn-sm btn-primary" (click)="newKit()">
                                    Add
                                </button>

                                <button class="btn btn-success btn-sm" [ngbTooltip]="'Export to Excel'">
                                    <i class="ri-file-excel-2-line"></i>
                                </button>

                                <div class="search-box position-relative">
                                    <input type="text" class="form-control" placeholder="Search..."
                                        [(ngModel)]="searchTerm" (keyup)="onSearchChange()">
                                    <i class="ri-search-line search-icon"></i>
                                </div>

                            </div>

                        </div>
                    </div>
                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover table-bordered mb-0 table-sm">
                                <thead class="table-light">
                                    <tr>
                                        <th class="sort" (click)="onSort('')">
                                            Sr. No.</th>
                                        <th class="sort" (click)="onSort('')">
                                            Product Name</th>
                                        <th class="sort" (click)="onSort('')">
                                            Date Added</th>
                                        <th class="sort" (click)="onSort('')">Status
                                        </th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr *ngFor="let kit of kitData; let i = index" class="table-row"
                                        (click)="onKitClick(kit)">
                                        <td>{{ i + 1 }}</td>
                                        <td>{{ kit.kitName }}</td>
                                        <td>{{ kit.kitDate }}</td>
                                        <span class="badge" [ngClass]="kit.status ? 'bg-success' : 'bg-danger'">
                                            {{ kit.status ? 'Active' : 'Inactive' }}
                                        </span>
                                    </tr>

                                    <!-- No Data -->
                                    <tr *ngIf="!kitData || kitData.length === 0">
                                        <td colspan="4" class="text-center text-muted py-3">
                                            No Data Available
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                        </div>
                        <!-- PAGINATION -->
                        <div class="col-sm-12 col-md-12 mt-2">
                            <div class="text-md-right float-md-end gridjs-pagination">
                                <ngb-pagination [collectionSize]="kitData.length" [(page)]="page" [pageSize]="pageSize"
                                    (pageChange)="onPageChange($event)" [boundaryLinks]="true" [maxSize]="10">
                                </ngb-pagination>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<router-outlet></router-outlet>
