<!-- src\app\components\designation-master\designation-master.html -->
<div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
  <h4 class="mb-sm-0">{{ isEditMode ? 'Edit Designation' : 'Add Designation' }}</h4>
</div>

<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">
        <form #desigForm="ngForm" (ngSubmit)="onSubmit(desigForm)">
          <div class="row mb-3">

            <!-- Designation Name -->
            <div class="col-md-3">
              <label>Designation Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-sm"
                [(ngModel)]="formData.designationName" name="designationName"
                (input)="checkDuplicateDesignation()" required>
              <div *ngIf="designationExists" class="text-danger mt-1">
                Designation already exists
              </div>
            </div>

            <!-- Abbreviation -->
            <div class="col-md-3">
              <label>Abbreviation</label>
              <input type="text" class="form-control form-control-sm"
                [(ngModel)]="formData.abbreviation" name="abbreviation">
            </div>

            <!-- Department -->
            <div class="col-md-3">
              <label>Department</label>
              <select class="form-select form-select-sm"
                [(ngModel)]="formData.departmentId" name="departmentId">
                <option [ngValue]="null">--Select Department--</option>
                <option *ngFor="let dept of departmentList" [ngValue]="dept.departmentId">
                  {{ dept.departmentName }}
                </option>
              </select>
            </div>

            <!-- Active -->
            <div class="col-md-3">
              <label>Active</label><br>
              <div class="form-check form-switch mt-1">
                <input class="form-check-input" type="checkbox"
                  [(ngModel)]="formData.isActive" name="isActive">
                <label class="form-check-label">
                  {{ formData.isActive ? 'Active' : 'Inactive' }}
                </label>
              </div>
            </div>

          </div>

          <div class="row mt-4">
            <div class="col-md-12 d-flex justify-content-end gap-2">
              <button type="submit" class="btn btn-primary btn-sm"
                *ngIf="(!isEditMode && canCreate) || (isEditMode && canEdit)"
                [disabled]="desigForm.invalid || designationExists">Save</button>
              <button type="button" class="btn btn-light btn-sm" (click)="onCancel()">Close</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
