<!-- src\app\components\hsrp-order\hsrporder-list\hsrporder-list.html -->
<div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
    <h4 class="mb-sm-0">HSRP Order List</h4>
</div>

<div class="row">
    <div class="col-lg-12">

        <div class="card">

            <!-- HEADER -->
            <div class="card-header">

                <div class="d-flex justify-content-between align-items-end flex-wrap gap-2">

                    <!-- LEFT SIDE (Date Filters) -->
                    <div class="d-flex align-items-end gap-2">

                        <!-- FROM DATE -->
                        <div style="width: 120px;">
                            <label class="form-label mb-1 small">From Date</label>
                            <input type="text" class="form-control form-control-sm" mwlFlatpickr
                                [(ngModel)]="filter.fromDate" (ngModelChange)="onFilterChange()" [altInput]="true"
                                [altFormat]="'d-m-Y'" [dateFormat]="'Y-m-d'" placeholder="From Date">
                        </div>

                        <!-- TO DATE -->
                        <div style="width: 120px;">
                            <label class="form-label mb-1 small">To Date</label>
                            <input type="text" class="form-control form-control-sm" mwlFlatpickr
                                [(ngModel)]="filter.toDate" (ngModelChange)="onFilterChange()" [altInput]="true"
                                [altFormat]="'d-m-Y'" [dateFormat]="'Y-m-d'" placeholder="To Date">
                        </div>
                        <div class="col-md-auto">
                            <button class="btn btn-primary btn-sm">
                                Search
                            </button>
                        </div>

                    </div>

                    <!-- RIGHT SIDE (Search) -->
                    <!-- RIGHT SIDE (Dropdown + Search) -->
                    <div class="d-flex align-items-center gap-3">

                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button class="btn btn-success btn-sm" *ngIf="canDownload" [ngbTooltip]="'Export to Excel'" (click)="downloadHSRPExcel()">
                                <i class="ri-file-excel-2-line"></i>
                            </button>
                        </div>

                        <!-- Search -->
                        <div class="search-box">
                            <input type="text" class="form-control search" placeholder="Search..."
                                [(ngModel)]="searchTerm" (input)="onSearchChange()" />
                            <i class="ri-search-line search-icon"></i>
                        </div>

                    </div>

                </div>

            </div>

            <!-- BODY -->
            <div class="card-body">


                <div class="table-responsive fixed-table" id="hsrpTable">

                    <table class="table table-bordered table-striped table-sm" style="font-size: 12px;">

                        <thead>
                            <tr>
                                <th class="text-center">

                                    Sl No
                                </th>

                                <th>Order No</th>
                                <th>Order Date</th>
                                <th>Supplier Name</th>
                                <th>Chassis No/Reg No</th>
                                <th class="text-center">HSRP Order Status</th>
                                <th class="text-center">HSRP Order Response</th>
                                <th class="text-center">Inward Status</th>
                                <th class="text-center">Inward Response</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr *ngIf="paginatedOrders.length === 0">
                                <td colspan="9" class="text-center">No data available</td>
                            </tr>

                            <tr *ngFor="let item of paginatedOrders; let i = index" (dblclick)="goToDetails(item)"
                                style="cursor: pointer;">

                                <!-- SL -->
                                <td class="text-center">

                                    {{ (i + 1) + ((page - 1) * pageSize) }}
                                </td>


                                <td>
                                    <ngb-highlight [result]="item.orderNo || '-' " [term]="searchTerm"></ngb-highlight>

                                </td>


                                <td>
                                    <ngb-highlight [result]="item.orderDate| date:'dd-MM-yyyy'"
                                        [term]="searchTerm"></ngb-highlight>
                                </td>


                                <td>
                                    <ngb-highlight [result]="item.supplierName || '-' "
                                        [term]="searchTerm"></ngb-highlight>
                                </td>


                                <td>
                                    <div>
                                        <strong>Chassis:</strong>
                                        <ngb-highlight [result]="item.chassisNo" [term]="searchTerm"></ngb-highlight>
                                    </div>
                                    <div>
                                        <strong>Reg No:</strong>
                                        <ngb-highlight [result]="item.regNo" [term]="searchTerm"></ngb-highlight>
                                    </div>
                                </td>


                                <td>
                                    <ngb-highlight [result]="item.hsrpStatus" [term]="searchTerm"></ngb-highlight>
                                </td>
                                <td>
                                    <ngb-highlight [result]="item.hsrpResponse" [term]="searchTerm"></ngb-highlight>
                                </td>

                                <td>
                                    <ngb-highlight [result]="item.inwardStatus || '-' "
                                        [term]="searchTerm"></ngb-highlight>
                                </td>


                                <!-- RESPONSE -->
                                <td>
                                    <ngb-highlight [result]="item.inwardResponse || '-' "
                                        [term]="searchTerm"></ngb-highlight>
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <!-- ACTIONS -->


                <!-- PAGINATION -->
                <div class="mt-3 d-flex justify-content-end">
                    <ngb-pagination [collectionSize]="filteredOrders.length" [(page)]="page" [pageSize]="pageSize"
                        (pageChange)="onPageChange($event)">
                    </ngb-pagination>
                </div>

            </div>
        </div>
    </div>
</div>
