<div id="free-service-claim-list">
    <!-- Start Breadcrumbs -->
    <app-breadcrumbs title="Free Service Claim"></app-breadcrumbs>
    <!-- End Breadcrumbs -->

    <div class="card-body">
        <div class="page-content p-0">
            <div class="container-fluid px-1">

                <!-- Table Card -->
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">

                            <div class="text-muted">
                                Total Record(s): {{ collectionSize }}
                            </div>

                            <div class="d-flex align-items-center gap-2">

                                <button class="btn btn-sm btn-primary" (click)="newClaim()">
                                    Add
                                </button>

                                <div class="search-box position-relative">
                                    <input type="text" class="form-control" placeholder="Search..."
                                        [(ngModel)]="searchTerm" (keyup)="onSearchChange()">
                                    <i class="ri-search-line search-icon"></i>
                                </div>

                            </div>

                        </div>
                    </div>
                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover table-bordered mb-0 table-sm">
                                <thead class="table-light">
                                    <tr>
                                        <th> Sr. No. </th>
                                        <th> Claim Prefix </th>
                                        <th> Mobile No.</th>
                                        <th> Claim No / Claim Date </th>
                                        <th> Location Name </th>
                                        <th> Supplier Name </th>
                                        <th> JobFrom/JobTo Date </th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr *ngFor="let claim of dataSource;" class="table-row">
                                        <td>{{ claim?.sr.no }}</td>
                                        <td>{{ claim?.preifx }}</td>
                                        <td>{{ claim?.claimDate }}</td>
                                        <td>{{ claim?.location }}</td>
                                        <td>{{ claim?.supllier }}</td>
                                        <td>{{ claim?.jobDate }}</td>
                                    </tr>

                                    <!-- No Data -->
                                    <tr *ngIf="!dataSource || dataSource.length === 0">
                                        <td colspan="6" class="text-center text-muted py-3">
                                            No Data Available
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                        </div>
                        <!-- PAGINATION -->
                        <div class="col-sm-12 col-md-12 mt-2">
                            <div class="text-md-right float-md-end gridjs-pagination">
                                <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [pageSize]="pageSize"
                                    (pageChange)="onPageChange($event)" [maxSize]="5" [boundaryLinks]="true">
                                </ngb-pagination>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
