<!-- src\app\components\role-master\role-list-master\role-list-master.html -->
<!-- Title -->
<div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
  <h4 class="mb-sm-0">Dealer Employee Role Master</h4>
  <button class="btn btn-primary btn-sm" *ngIf="canCreate" (click)="onAdd()">+ Add Role</button>
</div>

<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">

        <!-- Search -->
        <div class="row mb-3">
          <div class="col-md-4">
            <input type="text" class="form-control form-control-sm" placeholder="Search role or category..."
              [(ngModel)]="searchText" (input)="applyFilter()">
          </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 60px;">#</th>
                <th>Role Name</th>
                <th>Category</th>
                <th style="width: 120px;" class="text-center">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let role of filteredList; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ role.roleName }}</td>
                <td>
                  <span class="badge bg-info">{{ role.category }}</span>
                </td>
                  <td class="text-center">
                    <button *ngIf="canEdit" class="btn btn-sm btn-outline-primary me-1" (click)="onEdit(role)" title="Edit">
                        <i class="ri-edit-line"></i>
                    </button>
                    <button *ngIf="canDelete" class="btn btn-sm btn-danger" (click)="onDelete(role)" title="Delete">
                        <i class="ri-delete-bin-line"></i>
                    </button>
                </td>
              </tr>

              <tr *ngIf="filteredList.length === 0">
                <td colspan="4" class="text-center text-muted py-3">No roles found.</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>
