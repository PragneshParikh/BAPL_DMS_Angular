<div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
    <h4 class="mb-sm-0">JobSource Master</h4>
</div>

<!-- Add  Modal -->
<ng-template #jobSourceAdd let-modal>

    <form [formGroup]="jobSourceForm">

        <div class="card">

            <div class="modal-header item-modal-header">
                <h5 class="modal-title">
                    {{ jobSourceForm.value.jobSourceId > 0 ? 'Edit JobSource Master' : 'Add JobSource Master' }}
                </h5>

                <button type="button" class="btn-close btn-close-white" (click)="modal.dismiss()">
                </button>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6">
                        <label class="form-label">
                            JobSource Name
                        </label>

                        <input type="text" class="form-control" formControlName="JobSourceName"
                            placeholder="Enter JobSource Name">

                        <small class="text-danger" *ngIf="jobSourceForm.get('JobSourceName')?.touched &&
                                      jobSourceForm.get('JobSourceName')?.invalid">

                            JobSource Name is required
                        </small>
                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button type="button" class="btn btn-primary" (click)="saveJobSource(modal)">
                    Save
                </button>

                <button type="button" class="btn btn-light" (click)="modal.dismiss()">
                    Close
                </button>

            </div>

        </div>

    </form>

</ng-template>

<!-- Grid -->
<div class="row">

    <div class="col-lg-12">

        <div class="card">

            <div class="card-header">

                <div class="d-flex justify-content-end align-items-center">

                    <button class="btn btn-primary btn-sm me-2" (click)="openAddDetails()">
                        Add
                    </button>

                    <button class="btn btn-success btn-sm me-3" (click)="downloadJobSourceMasterExcel()">
                        <i class="ri-file-excel-2-line"></i>
                    </button>

                    <div class="search-box">
                        <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText"
                            (input)="applySearch()">
                        <i class="ri-search-line search-icon"></i>
                    </div>

                </div>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover table-sm">

                        <thead class="table-bgColor">

                            <tr>
                                <th width="80">Sr No.</th>

                                <th class="sort" (click)="sort('jobSourceName')" style="cursor:pointer">
                                    JobSource Name
                                </th>

                                <th width="120">
                                    Action
                                </th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr *ngFor="let item of pagedData; let i = index" (click)="openEditPopup(item)"
                                style="cursor:pointer">

                                <td>
                                    {{ ((page - 1) * pageSize) + i + 1 }}
                                </td>

                                <td>
                                    {{ item.jobSourceName }}
                                </td>

                                <td>

                                    <button class="btn btn-danger btn-sm" (click)="deleteJobSource(item.id, $event)">
                                        <i class="ri-delete-bin-5-line"></i>
                                    </button>

                                </td>

                            </tr>

                            <tr *ngIf="pagedData.length === 0">

                                <td colspan="3" class="text-center">
                                    No Data Available
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <div class="row">

                    <div class="col-md-12">

                        <div class="float-end">

                            <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [pageSize]="pageSize"
                                (pageChange)="pageChange($event)" [maxSize]="5" [boundaryLinks]="true">
                            </ngb-pagination>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<ng-template #jobSourceUpdate let-modal>

    <form [formGroup]="jobSourceForm">

        <div class="card">

            <div class="modal-header item-modal-header">
                <h5 class="modal-title">
                    Edit JobSource Master
                </h5>

                <button type="button" class="btn-close btn-close-white" (click)="modal.dismiss()">
                </button>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6">
                        <label class="form-label">
                            JobSource Name
                        </label>

                        <input type="text" class="form-control" formControlName="JobSourceName"
                            placeholder="Enter JobSource Name">

                        <small class="text-danger" *ngIf="jobSourceForm.get('JobSourceName')?.touched &&
                                      jobSourceForm.get('JobSourceName')?.invalid">

                            JobSource Name is required
                        </small>
                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button type="button" class="btn btn-primary" (click)="updateJobSource(modal)">
                    Save
                </button>

                <button type="button" class="btn btn-light" (click)="modal.dismiss()">
                    Close
                </button>

            </div>

        </div>

    </form>

</ng-template>
