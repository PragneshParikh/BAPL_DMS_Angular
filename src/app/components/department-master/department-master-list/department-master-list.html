<!-- src\app\components\department-master\department-master-list\department-master-list.html -->
<!-- Title -->
<div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
  <h4 class="mb-sm-0">Department Master</h4>
  <button *ngIf="canCreate" class="btn btn-primary btn-sm" (click)="onAdd()">+ Add Department</button>
</div>

<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">

        <!-- Search -->
        <div class="row mb-3">
          <div class="col-md-4">
            <input type="text" class="form-control form-control-sm" placeholder="Search department..."
              [(ngModel)]="searchText" (input)="applyFilter()">
          </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 60px;">#</th>
                <th>Department Name</th>
                <th>Abbreviation</th>
                <th style="width: 120px;">Status</th>
                <th style="width: 140px;" class="text-center">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let dept of filteredList; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ dept.departmentName }}</td>
                <td>{{ dept.abbreviation }}</td>
             
                <td>
                  <span class="badge" [ngClass]="dept.isActive ? 'bg-success' : 'bg-secondary'">
                    {{ dept.isActive ? 'Active' : 'Inactive' }}
                  </span>
                </td>
                <td class="text-center">
                  <button *ngIf="canEdit" class="btn btn-sm btn-primary me-1" (click)="onEdit(dept.departmentId)">Edit</button>
                  <button *ngIf="canDelete" class="btn btn-sm btn-danger" (click)="onDelete(dept)">Delete</button>
              </td>
              </tr>

              <tr *ngIf="filteredList.length === 0">
                <td colspan="5" class="text-center text-muted py-3">No departments found.</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>
