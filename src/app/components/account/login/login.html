<!--src\app\components\account\login\login.html-->
<div class="login-root">

  <!-- Left panel — brand -->
  <div class="login-brand">
    <div class="login-brand-inner">
      <div class="login-logo">
        <img src="assets/images/BGauss_Logo.png" alt="BGauss" class="login-logo-img">
      </div>

      <h1 class="login-brand-headline">Dealer Management System</h1>
      <!-- <p class="login-brand-sub">Manage sales, service, and inventory — all in one place.</p> -->

      <div class="login-scooty-wrap">
        <a href="https://www.bgauss.com/" target="_blank" rel="noopener noreferrer">
            <img src="assets/images/Bg0-scooty.png" alt="BGauss scooter" class="login-scooty-img">
        </a>
    </div>
    </div>
  </div>

  <!-- Right panel — login card -->
  <div class="login-card-panel">
    <div class="login-card">
      <div class="login-card-header">
        <h2 class="login-card-title">Welcome back</h2>
        <p class="login-card-desc">Sign in to continue.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-dealer-form">

        <div class="login-dealer-field">
          <label for="username">Username</label>
          <input type="text" id="username" formControlName="username"
            [class.is-invalid]="submitted && f['username'].errors"
            placeholder="Enter your username">
          @if (submitted && f['username'].errors) {
          <div class="login-dealer-error">
            @if (f['username'].errors['required']) {
            <span>Username is required</span>
            }
          </div>
          }
        </div>

        <div class="login-dealer-field">
          <div class="login-field-label-row">
            <label for="password-input">Password</label>
            <a routerLink="/forgot-password" class="login-forgot-link">Forgot password?</a>
          </div>

          <div class="login-password-wrap">
            <input [type]="fieldTextType ? 'text' : 'password'" id="password-input"
              formControlName="password" placeholder="••••••••"
              [class.is-invalid]="submitted && f['password'].errors">
            <button type="button" class="login-password-toggle" (click)="toggleFieldTextType()">
              <i class="mdi align-middle"
                [ngClass]="{'mdi-eye-off-outline': !fieldTextType, 'mdi-eye-outline': fieldTextType}"></i>
            </button>
          </div>

          @if (submitted && f['password'].errors) {
          <div class="login-dealer-error">
            @if (f['password'].errors['required']) {
            <span>Password is required</span>
            }
          </div>
          }
        </div>

        <div class="login-remember-row">
          <input type="checkbox" id="auth-remember-check">
          <label for="auth-remember-check">Remember me</label>
        </div>

        <button class="btn-signin" type="submit" [disabled]="isLoading">
          @if (!isLoading) {
          <span>Sign In</span>
          } @else {
          <span class="d-flex align-items-center justify-content-center gap-2">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Signing In...
          </span>
          }
        </button>

      </form>
    </div>
  </div>

</div>
