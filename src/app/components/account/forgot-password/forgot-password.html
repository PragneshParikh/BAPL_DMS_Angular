<div class="container-fluid vh-100">
    <div class="row h-100">

        <!-- Left: Background -->
        <div class="col-lg-7 d-none d-lg-flex position-relative p-0 justify-content-center align-items-center"
            style="background-color: white;">
            <div class="d-flex flex-column justify-content-center align-items-center w-100">

                <div class="text-center">
                    <h1 class="text-primary logo-text" style="font-size: 35px; color: #405189 !important;">
                        Dealer Management System
                    </h1>
                </div>

                <div class="d-flex justify-content-center align-items-center">
                    <img src="assets/images/new_logo_image.png" alt="Shape" class="img-fluid">
                </div>

            </div>
        </div>

        <!-- Right: Login Form -->
        <div class="col-lg-5 d-flex align-items-center justify-content-center" style="background-color: #405189;">
            <div class="w-75">
                <div class="text-center mb-4">
                    <h1 class="text-primary" style="font-size: 35px; color: white !important;">Forgot Password
                    </h1>
                </div>

                <div class="card custom-shadow rounded-4 card-bg-fill">
                    <div class="card-body p-4">
                        <!-- <div class="text-center mb-4">
                            <h5 class="text-primary">Forgot Password</h5>
                        </div> -->

                        <form [formGroup]="passresetForm" (ngSubmit)="onSubmit()">
                            <div class="mb-4">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter Email"
                                    formControlName="email"
                                    [ngClass]="{ 'is-invalid': submitted && f['email'].errors }">
                                @if (submitted && f['email'].errors) {
                                <div class="invalid-feedback" align="left">
                                    @if(f['email'].errors['required']){
                                    <div>Email is required</div>
                                    }
                                </div>
                                }
                            </div>

                            <div class="mt-4">
                                <button class="btn btn-success w-100" type="submit" [disabled]="isLoading">
                                    <span *ngIf="!isLoading">Send Reset Link</span>
                                    <span *ngIf="isLoading">
                                        <span class="spinner-border spinner-border-sm me-2" role="status"
                                            aria-hidden="true"></span>
                                        Link Sending...
                                    </span>
                                </button>
                            </div>
                        </form>

                    </div>
                </div>

                <!-- Footer -->
                <footer class="text-center mt-4 text-muted " style="color: white !important;">
                    &copy; {{year}} BGauss Auto Pvt. Ltd.
                </footer>
            </div>
        </div>

    </div>
</div>
